    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-****" crossorigin="anonymous" />

<body>
    <header>
        <div class="first_row">
            <a href="lesson.php"><i class="fas fa-arrow-left"></i></a>
            <h3>Vocabulary lesson</h3>
            <i class="fa-solid fa-square-plus"></i>
        </div>
        <p>it is a long established fact that a reader will be distracted by the readable </p>
    </header>
    <div id="marg"></div>
    <main>
        <div class="sup_cont">
            <div class="cont">
                <div class="word">
                    <div class="inner_word"><span>
                        </span><span>
                        </span></div>
                </div>
            </div>
            <a href="Quiz.php">Next</a>
        </div>
        <form action="add_to_folder.php">
            <div class="main">
                <div class="on_adding">
                    <div class="head">
                        <i class="fas fa-times"></i>
                    </div>
                    <label for="folder">Select Folder</label>
                    <select name="folder" id="folder_input">
                        <option value="1">hello</option>
                        <option value="1">hello</option>
                        <option value="1">hello</option>
                        <option value="1">hello</option>
                        <option value="1">hello</option>
                        <option value="1">hello</option>
                    </select>
                    <input type="submit" value="Add to Deck">
                </div>
            </div>
        </form>
    </main>
    <script src="../JS/vocabulary.js">
        let words = document.querySelectorAll('.word');
        let words_meaning = {};
        words.forEach(word => {
            const inner_word = word.childNodes[1];
            words_meaning[inner_word.childNodes[0].textContent] = inner_word.childNodes[1].textContent;
        });
        words.forEach(word => {
            word.innerHTML += '<div class="selected"><i class="fas fa-check-circle"></i></div>';

        });
        words.forEach(word => {
            word.addEventListener('click', function() {
                if (word.children[1].style.opacity == 0)
                    word.children[1].style.opacity = 1;
                else
                    word.children[1].style.opacity = 0;
            })
        });

        const folder = document.getElementById('folder_input');
        const legend = document.getElementById('fieldset-legend');
        const fieldset = document.querySelector('fieldset');
        folder.addEventListener('focus', function() {
            legend.style.display = 'block';
            fieldset.style.height = '60px';
            folder.setAttribute('placeholder', '');
        });

        folder.addEventListener('blur', function() {
            legend.style.display = 'none';
            fieldset.style.height = '50px';
            folder.setAttribute('placeholder', 'Select Folder');
        });

        const x = document.querySelector('.fa-times');
        const main = document.querySelector('.main');
        const add = document.querySelector('.fa-square-plus');
        x.addEventListener('click', function() {
            main.style.top = '100vh';
        });
        add.addEventListener('click', function() {
            if (exit_selected().length > 0)
                main.style.top = '0px';
            else
                alert("Please select words");
        });

        function exit_selected() {
            let ans = new Array();
            words.forEach(word => {
                // console.log(word.children[1].style.opacity > 0);
                if (word.children[1].style.opacity > 0) {
                    ans.push('1');
                }
            });
            return ans;
        }
    </script>
</body>

</html>
